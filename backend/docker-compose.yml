services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pausa_massoterapia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pausa_massoterapia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pausa_postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: pausa_massoterapia_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pausa_massoterapia_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pausa_postgres:
